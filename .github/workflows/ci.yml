name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar testes com cobertura
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify -Pcobertura

      - name: Gerar registro dos resultados
        if: always()
        run: java scripts/RelatorioTestes.java

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports
            target/site/jacoco
            docs/evidencias/RESULTADOS_TESTES.md
