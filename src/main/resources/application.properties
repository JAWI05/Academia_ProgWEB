spring.application.name=progweb

# ---- Conexão H2 em arquivo (igual ao persistence.xml do exemplo do professor) ----
# AUTO_SERVER=TRUE permite abrir o banco em outra ferramenta enquanto a aplicação roda.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./database/academia;AUTO_SERVER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS APP\\;SET SCHEMA APP
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA/Hibernate (mesmas chaves do persistence.xml) ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=APP
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.open-in-view=false

# Console H2 desligado por segurança. Para depuração local: H2_CONSOLE=true (http://localhost:8080/h2-console,
# schema APP). Com o Spring Security ligado, o acesso ao console exige ajuste na SecurityConfig.
spring.h2.console.enabled=${H2_CONSOLE:false}

# Carga inicial idempotente (CargaInicial)
academia.carga.inicial=true

# Base de demonstração com dados fictícios (60 clientes, ~45 aulas, 12 personais...). Só roda com a base quase vazia.
academia.carga.demo=true

# Usuários de demonstração (criados só quando não existe nenhum usuário; senhas gravadas com BCrypt).
# ATENÇÃO: valores apenas para demonstração. Troque ou use variáveis de ambiente fora do ambiente de testes.
academia.usuarios.admin-senha=${ADMIN_SENHA:admin123}
academia.usuarios.operador-senha=${OPERADOR_SENHA:operador123}
spring.jpa.properties.hibernate.default_batch_fetch_size=50
