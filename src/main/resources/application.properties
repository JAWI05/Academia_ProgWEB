spring.application.name=progweb

# ---- Conexão H2 em arquivo (igual ao persistence.xml do exemplo do professor) ----
# AUTO_SERVER=TRUE permite abrir o banco em outra ferramenta enquanto a aplicação roda.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./database/academia;AUTO_SERVER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS APP\\;SET SCHEMA APP
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA/Hibernate (mesmas chaves do persistence.xml) ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=APP
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.open-in-view=false

# Console H2 em http://localhost:8080/h2-console (somente desenvolvimento; as tabelas ficam no schema APP)
spring.h2.console.enabled=true

# Carga inicial idempotente (CargaInicial)
academia.carga.inicial=true
