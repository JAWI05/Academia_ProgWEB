<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body class="login-page">

<main class="d-flex flex-grow-1 align-items-center justify-content-center p-3">
  <div class="card login-card">
    <div class="card-body p-4">
      <h1 class="h3 text-center mb-1">Academia Fitness</h1>
      <p class="text-center mb-4">Acesse com o seu usuário</p>

      <div class="alert alert-danger" role="alert" th:if="${param.error}">Usuário ou senha inválidos.</div>
      <div class="alert alert-danger" role="alert" th:if="${param.desativado}">Sua conta foi desativada. Procure um administrador.</div>
      <div class="alert alert-info" role="alert" th:if="${param.logout}">Você saiu do sistema.</div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label" for="username">Usuário</label>
          <input type="text" class="form-control" id="username" name="username" autocomplete="username" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Senha</label>
          <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
