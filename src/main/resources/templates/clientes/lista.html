<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('clientes')}"></header>

<div class="page-header">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
    <div>
      <h1>Clientes</h1>
      <p>Alunos cadastrados na academia</p>
    </div>
    <a class="btn btn-accent" th:href="@{/clientes/novo}">Novo cliente</a>
  </div>
</div>

<main class="container pb-5">
  <div th:replace="~{fragments/layout :: mensagens}"></div>

  <div class="alert alert-info mt-3" th:if="${clientes.isEmpty()}">Nenhum cliente cadastrado.</div>

  <div class="table-wrapper table-responsive mt-3" th:unless="${clientes.isEmpty()}">
    <table class="table table-striped table-hover align-middle">
      <thead>
        <tr><th>Nome</th><th>E-mail</th><th>Objetivo</th><th>Cadastro</th><th class="text-end">Ações</th></tr>
      </thead>
      <tbody>
        <tr th:each="c : ${clientes}">
          <td th:text="${c.nome}">Nome</td>
          <td th:text="${c.email}">email@exemplo.com</td>
          <td th:text="${c.objetivo != null ? c.objetivo : '—'}">Objetivo</td>
          <td th:text="${#temporals.format(c.dataCadastro, 'dd/MM/yyyy')}">01/01/2026</td>
          <td class="text-end">
            <div class="d-inline-flex gap-2">
              <a class="btn btn-sm btn-outline-primary" th:href="@{/clientes/{id}/editar(id=${c.id})}">Editar</a>
              <form method="post" th:action="@{/clientes/{id}/excluir(id=${c.id})}"
                    onsubmit="return confirm('Excluir este cliente?');">
                <button type="submit" class="btn btn-sm btn-outline-primary">Excluir</button>
              </form>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
