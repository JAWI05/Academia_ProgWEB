<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuário')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('usuarios')}"></header>

<div class="page-header">
  <div class="container"><h1 th:text="${titulo}">Novo usuário</h1></div>
</div>

<main class="container pb-5">
  <div class="card">
    <div class="card-body">
      <form method="post" th:action="@{${acao}}" th:object="${form}" novalidate>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
          <p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}">Erro</p>
        </div>

        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label" for="nome">Nome</label>
            <input type="text" class="form-control" id="nome" th:field="*{nome}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{nome}">Erro</div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="login">Login</label>
            <input type="text" class="form-control" id="login" th:field="*{login}" th:readonly="${editando}" th:errorclass="is-invalid" autocomplete="off">
            <div class="invalid-feedback" th:errors="*{login}">Erro</div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="perfil">Perfil</label>
            <select class="form-select" id="perfil" th:field="*{perfil}" th:errorclass="is-invalid">
              <option value="">Selecione</option>
              <option th:each="p : ${perfis}" th:value="${p.name()}" th:text="${p.rotulo}">Perfil</option>
            </select>
            <div class="invalid-feedback" th:errors="*{perfil}">Erro</div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="senha" th:text="${editando} ? 'Nova senha (deixe em branco para manter)' : 'Senha'">Senha</label>
            <input type="password" class="form-control" id="senha" th:field="*{senha}" th:errorclass="is-invalid" autocomplete="new-password">
            <div class="invalid-feedback" th:errors="*{senha}">Erro</div>
          </div>
        </div>

        <div class="mt-4 actions">
          <button type="submit" class="btn btn-primary me-2">Salvar</button>
          <a class="btn btn-outline-primary" th:href="@{/usuarios}">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
