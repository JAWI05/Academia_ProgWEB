<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuários')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('usuarios')}"></header>

<div class="page-header">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
    <div>
      <h1>Usuários</h1>
      <p>Contas de acesso ao sistema e seus perfis</p>
    </div>
    <a class="btn btn-accent" th:href="@{/usuarios/novo}">Novo usuário</a>
  </div>
</div>

<main class="container pb-5">
  <div th:replace="~{fragments/layout :: mensagens}"></div>

  <div class="table-wrapper table-responsive mt-3">
    <table class="table table-striped table-hover align-middle">
      <thead>
        <tr><th>Nome</th><th>Login</th><th>Perfil</th><th>Situação</th><th class="text-end">Ações</th></tr>
      </thead>
      <tbody>
        <tr th:each="u : ${usuarios}">
          <td th:text="${u.nome}">Nome</td>
          <td th:text="${u.login}">login</td>
          <td th:text="${u.perfil.rotulo}">Perfil</td>
          <td><span class="status" th:classappend="${u.ativo} ? 'status-ativo' : 'status-inativo'" th:text="${u.ativo} ? 'ATIVO' : 'INATIVO'">ATIVO</span></td>
          <td class="text-end">
            <div class="d-inline-flex gap-2">
              <a class="btn btn-sm btn-outline-primary" th:href="@{/usuarios/{id}/editar(id=${u.id})}">Editar</a>
              <form method="post" th:action="@{/usuarios/{id}/ativo(id=${u.id})}">
                <button type="submit" class="btn btn-sm btn-outline-primary"
                        th:disabled="${u.login == loginLogado}"
                        th:text="${u.ativo} ? 'Desativar' : 'Ativar'">Desativar</button>
              </form>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
