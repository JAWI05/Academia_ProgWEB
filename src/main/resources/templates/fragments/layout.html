<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!--
  Fragmentos reutilizáveis. Em cada página:

  <head th:replace="~{fragments/layout :: head('Aulas')}"></head>
  <body>
    <header th:replace="~{fragments/layout :: navbar('aulas')}"></header>
    <main> ... conteúdo ... </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
  </body>
-->
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · Academia Fitness'">Academia Fitness</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

<header th:fragment="navbar(ativo)">
  <nav class="navbar navbar-expand-lg navbar-academia navbar-dark">
    <div class="container">
      <a class="navbar-brand" th:href="@{/}">Academia Fitness</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
              aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'inicio'} ? 'active'" th:href="@{/}">Início</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'aulas'} ? 'active'" th:href="@{/aulas}">Aulas</a></li>
          <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'clientes'} ? 'active'" th:href="@{/clientes}">Clientes</a></li>
        </ul>
        <!-- 3ª entrega: exibir usuário e botão Sair (form POST /logout) com sec:authorize -->
      </div>
    </div>
  </nav>
</header>

<footer th:fragment="footer" class="footer-academia">
  <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
    <span>© 2026 Academia Fitness · Projeto Integrador de Programação Web — ESEG</span>
    <span>Spring Boot · JPA · Thymeleaf · Bootstrap</span>
  </div>
</footer>

<div th:fragment="mensagens" class="container mt-3">
  <div th:if="${sucesso}" class="alert alert-success" role="alert" th:text="${sucesso}">Sucesso</div>
  <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}">Erro</div>
</div>

<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
