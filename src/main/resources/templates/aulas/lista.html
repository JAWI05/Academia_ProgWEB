<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Aulas')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('aulas')}"></header>

<div class="page-header">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
    <div>
      <h1>Aulas</h1>
      <p>Horários, personal trainers e vagas disponíveis</p>
    </div>
    <a class="btn btn-accent" sec:authorize="hasRole('ADMIN')" th:href="@{/aulas/nova}">Nova aula</a>
  </div>
</div>

<main class="container pb-5">
  <div th:replace="~{fragments/layout :: mensagens}"></div>

  <form class="row g-2 align-items-end my-3" method="get" th:action="@{/aulas}">
    <div class="col-12 col-sm-6 col-md-4">
      <label class="form-label" for="status">Filtrar por status</label>
      <select class="form-select" id="status" name="status">
        <option value="">Todos</option>
        <option th:each="s : ${todosStatus}" th:value="${s.name()}" th:text="${s.name()}"
                th:selected="${statusSelecionado != null and statusSelecionado == s}">STATUS</option>
      </select>
    </div>
    <div class="col-12 col-sm-6 col-md-3 actions">
      <button type="submit" class="btn btn-primary">Filtrar</button>
      <a class="btn btn-outline-primary" th:href="@{/aulas}">Limpar</a>
    </div>
  </form>

  <div class="alert alert-info" th:if="${aulas.isEmpty()}">Nenhuma aula encontrada.</div>

  <div class="table-wrapper table-responsive" th:unless="${aulas.isEmpty()}">
    <table class="table table-striped table-hover align-middle">
      <thead>
        <tr><th>Esporte</th><th>Personal</th><th>Unidade</th><th>Início</th><th>Duração</th><th>Vagas</th><th>Status</th><th class="text-end">Ações</th></tr>
      </thead>
      <tbody>
        <tr th:each="aula : ${aulas}">
          <td th:text="${aula.esporte()}">Esporte</td>
          <td th:text="${aula.personal()}">Personal</td>
          <td th:text="${aula.unidade()}">Unidade</td>
          <td th:text="${#temporals.format(aula.inicio(), 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
          <td th:text="${aula.duracaoMin() + ' min'}">60 min</td>
          <td th:text="${aula.vagasDisponiveis() + ' / ' + aula.capacidade()}">1 / 2</td>
          <td><span class="status" th:classappend="${'status-' + #strings.toLowerCase(aula.status().name())}" th:text="${aula.status()}">AGENDADA</span></td>
          <td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/aulas/{id}(id=${aula.id()})}">Ver</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
